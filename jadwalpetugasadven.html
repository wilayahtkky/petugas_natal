<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal & Petugas Adven 2026 - Katedral Jakarta</title>
  <link rel="stylesheet" href="style-jdwlptgsadv.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="header-title-group">
        <h1>Jadwal Petugas Adven 2026</h1>
        <p class="subtitle">Perarakan Korona &amp; Pasutri Penyala Lilin Adven</p>
      </div>
      <div class="header-actions">
        <span id="authBadge" class="auth-badge locked">Mode Publik</span>
        <button id="btnToggleAuth" class="btn btn-primary" type="button">Kelola</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Filter Panel -->
    <section class="filter-card" aria-label="Filter Jadwal">
      <div class="filter-grid">
        <div class="filter-group">
          <label for="filterEvent">Minggu Adven</label>
          <select id="filterEvent">
            <option value="">Semua Minggu Adven</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterTanggal">Hari / Tanggal</label>
          <select id="filterTanggal">
            <option value="">Semua Tanggal</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterJam">Jam Misa</label>
          <select id="filterJam">
            <option value="">Semua Jam Misa</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterPic">PIC</label>
          <select id="filterPic">
            <option value="">Semua PIC</option>
          </select>
        </div>
        <div class="filter-group filter-reset-wrap">
          <button id="btnResetFilter" class="btn btn-secondary" type="button">Reset Filter</button>
        </div>
      </div>
    </section>

    <!-- Loading / Status Banner -->
    <div id="statusMessage" class="status-banner hidden"></div>

    <!-- Hierarchical Event -> Hari/Tanggal -> Jam -> Korona & Penyala Lilin -->
    <section id="scheduleContainer" class="schedule-hierarchy" aria-live="polite">
      <div class="empty-state">Memuat data jadwal petugas...</div>
    </section>
  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="loginModalTitle">Login PIC / Koordinator</h3>
        <button type="button" class="modal-close" data-close="loginModal">&times;</button>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="inputUsername">Username</label>
          <input type="text" id="inputUsername" required autocomplete="username" placeholder="Masukkan username" />
        </div>
        <div class="form-group">
          <label for="inputPassword">Password</label>
          <input type="password" id="inputPassword" required autocomplete="current-password" placeholder="Masukkan password" />
        </div>
        <p id="loginError" class="form-error hidden"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close="loginModal">Batal</button>
          <button type="submit" id="btnSubmitLogin" class="btn btn-primary">Masuk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="editModalTitle">Edit Data Petugas</h3>
        <button type="button" class="modal-close" data-close="editModal">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editSheet" />
        <input type="hidden" id="editRowIndex" />

        <div id="editContextInfo" class="context-box"></div>

        <!-- Fields for jadwalkorona -->
        <div id="koronaFields" class="hidden">
          <div class="form-group">
            <label for="editNamaPetugas">Nama Petugas</label>
            <input type="text" id="editNamaPetugas" />
          </div>
          <div class="form-group">
            <label for="editWa">No. WhatsApp</label>
            <input type="tel" id="editWa" placeholder="Contoh: 081234567890" />
          </div>
        </div>

        <!-- Fields for jadwalpenyalalilin -->
        <div id="lilinFields" class="hidden">
          <div class="form-group">
            <label for="editNamaSuami">Nama Suami</label>
            <input type="text" id="editNamaSuami" />
          </div>
          <div class="form-group">
            <label for="editNamaIstri">Nama Istri</label>
            <input type="text" id="editNamaIstri" />
          </div>
          <div class="form-group">
            <label for="editNoSuami">No. HP Suami</label>
            <input type="tel" id="editNoSuami" placeholder="Contoh: 081234567890" />
          </div>
          <div class="form-group">
            <label for="editNoIstri">No. HP Istri</label>
            <input type="tel" id="editNoIstri" placeholder="Contoh: 081234567890" />
          </div>
        </div>

        <!-- Custom Combo PIC Field (shows all options + allows free text) -->
        <div class="form-group">
          <label for="editPic">PIC (Pilih dari daftar atau ketik manual)</label>
          <div class="combo-wrapper" id="picComboWrapper">
            <input type="text" id="editPic" autocomplete="off" placeholder="Pilih atau ketik nama PIC" />
            <button type="button" id="btnTogglePicList" class="combo-toggle-btn" aria-label="Tampilkan daftar PIC">&#9662;</button>
            <ul id="picDropdownList" class="combo-dropdown hidden" role="listbox"></ul>
          </div>
        </div>

        <p id="editError" class="form-error hidden"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close="editModal">Batal</button>
          <button type="submit" id="btnSaveEdit" class="btn btn-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script-jdwlptgsadv.js"></script>
</body>
</html>
